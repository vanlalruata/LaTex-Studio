<rect x="20" y="158" width="1400" height="690" rx="10" class="panel" filter="url(#shadow)"/><rect x="20" y="158" width="245" height="690" rx="10" fill="#f8fafd"/><text x="42" y="192" class="ui dark" font-size="13" font-weight="700">PROJECT FILES</text><text x="42" y="230" class="ui muted small">▾</text><text x="67" y="230" class="ui dark small">paper-project/</text><text x="42" y="264" class="ui muted small">•</text><text x="67" y="264" class="ui dark small">main.tex</text><text x="42" y="298" class="ui muted small">•</text><text x="67" y="298" class="ui dark small">references.bib</text><text x="42" y="332" class="ui muted small">▾</text><text x="67" y="332" class="ui dark small">sections/</text><text x="42" y="366" class="ui muted small">•</text><text x="67" y="366" class="ui dark small">introduction.tex</text><text x="42" y="400" class="ui muted small">•</text><text x="67" y="400" class="ui dark small">methodology.tex</text><text x="42" y="434" class="ui muted small">•</text><text x="67" y="434" class="ui dark small">results.tex</text><text x="42" y="468" class="ui muted small">▾</text><text x="67" y="468" class="ui dark small">figures/</text><text x="42" y="502" class="ui muted small">•</text><text x="67" y="502" class="ui dark small">architecture.png</text><rect x="265" y="158" width="655" height="42" fill="#f5f7fb"/><text x="286" y="185" class="ui dark small" font-weight="700">main.tex</text><text x="380" y="185" class="ui muted small">references.bib</text><rect x="274" y="202" width="638" height="610" fill="#fff"/><text x="292" y="238" class="ui muted tiny">01</text><text x="330" y="238" font-family="monospace" font-size="14" fill="#7655c9">\documentclass[preprint,12pt]{elsarticle}</text><text x="292" y="269" class="ui muted tiny">02</text><text x="330" y="269" font-family="monospace" font-size="14" fill="#7655c9">\usepackage{amsmath,amssymb,graphicx}</text><text x="292" y="300" class="ui muted tiny">03</text><text x="330" y="300" font-family="monospace" font-size="14" fill="#7655c9">\usepackage{booktabs,hyperref}</text><text x="292" y="331" class="ui muted tiny">04</text><text x="330" y="331" font-family="monospace" font-size="14" fill="#7655c9">\begin{document}</text><text x="292" y="362" class="ui muted tiny">05</text><text x="330" y="362" font-family="monospace" font-size="14" fill="#7655c9">\title{A Hybrid Framework for IoT Security}</text><text x="292" y="393" class="ui muted tiny">06</text><text x="330" y="393" font-family="monospace" font-size="14" fill="#7655c9">\author{Vanlalruata Hnamte}</text><text x="292" y="424" class="ui muted tiny">07</text><text x="330" y="424" font-family="monospace" font-size="14" fill="#7655c9">\begin{abstract}</text><text x="292" y="455" class="ui muted tiny">08</text><text x="330" y="455" font-family="monospace" font-size="14" fill="#334155">We investigate a robust detection framework for</text><text x="292" y="486" class="ui muted tiny">09</text><text x="330" y="486" font-family="monospace" font-size="14" fill="#334155">distributed denial-of-service attacks in IoT.</text><text x="292" y="517" class="ui muted tiny">10</text><text x="330" y="517" font-family="monospace" font-size="14" fill="#7655c9">\end{abstract}</text><text x="292" y="548" class="ui muted tiny">11</text><text x="330" y="548" font-family="monospace" font-size="14" fill="#7655c9">\section{Introduction}</text><text x="292" y="579" class="ui muted tiny">12</text><text x="330" y="579" font-family="monospace" font-size="14" fill="#334155">Industrial IoT deployments require reliable</text><text x="292" y="610" class="ui muted tiny">13</text><text x="330" y="610" font-family="monospace" font-size="14" fill="#334155">monitoring and explainable threat detection.</text><text x="292" y="641" class="ui muted tiny">14</text><text x="330" y="641" font-family="monospace" font-size="14" fill="#7655c9">\begin{equation}</text><text x="292" y="672" class="ui muted tiny">15</text><text x="330" y="672" font-family="monospace" font-size="14" fill="#7655c9">\mathcal{L} = -\sum_{i=1}^{N} y_i \log(\hat{y}_i)</text><text x="292" y="703" class="ui muted tiny">16</text><text x="330" y="703" font-family="monospace" font-size="14" fill="#7655c9">\end{equation}</text><text x="292" y="734" class="ui muted tiny">17</text><text x="330" y="734" font-family="monospace" font-size="14" fill="#7655c9">\end{document}</text><rect x="920" y="158" width="500" height="42" fill="#f5f7fb"/><text x="944" y="185" class="ui dark small" font-weight="700">PDF PREVIEW</text><rect x="958" y="218" width="425" height="580" fill="#e9edf3"/><rect x="995" y="235" width="350" height="530" fill="#fff" filter="url(#shadow)"/><text x="1170" y="285" text-anchor="middle" class="ui dark" font-size="15" font-weight="700">A Hybrid Framework for IoT Security</text><text x="1170" y="310" text-anchor="middle" class="ui muted tiny">Vanlalruata Hnamte</text><rect x="1025" y="350" width="285" height="5" rx="2" fill="#d9dee7"/><rect x="1025" y="382" width="260" height="5" rx="2" fill="#d9dee7"/><rect x="1025" y="414" width="235" height="5" rx="2" fill="#d9dee7"/><rect x="1025" y="446" width="285" height="5" rx="2" fill="#d9dee7"/><rect x="1025" y="478" width="260" height="5" rx="2" fill="#d9dee7"/><rect x="1025" y="510" width="235" height="5" rx="2" fill="#d9dee7"/><rect x="1025" y="542" width="285" height="5" rx="2" fill="#d9dee7"/><rect x="1025" y="574" width="260" height="5" rx="2" fill="#d9dee7"/><rect x="1025" y="606" width="235" height="5" rx="2" fill="#d9dee7"/><rect x="38" y="817" width="1364" height="25" fill="#f4f7fb"/><text x="55" y="834" class="ui muted tiny">Saved · Revision r42</text><text x="1380" y="834" text-anchor="end" class="ui green tiny">PDF: successful build #118</text>
