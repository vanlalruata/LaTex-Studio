<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f8"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#17233b" flood-opacity=".10"/></filter>
 <style>
 .ui{font-family:Inter,Arial,sans-serif} .muted{fill:#758198} .dark{fill:#1e293b} .small{font-size:13px} .tiny{font-size:11px}
 .panel{fill:#fff;stroke:#e3e8f0;stroke-width:1} .line{stroke:#e8edf4;stroke-width:1}
 .blue{fill:#3268d8} .green{fill:#16845b} .red{fill:#c44949} .purple{fill:#7655c9}
 </style>
</defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="1440" height="58" fill="#17243a"/>
<circle cx="28" cy="29" r="13" fill="#5d8cf0"/><path d="M22 29h12M28 23v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="52" y="35" class="ui" fill="#fff" font-size="17" font-weight="700">ResearchForge</text>
<text x="225" y="35" class="ui" fill="#b8c5d9" font-size="12">LaTeX Research Workspace</text>
<rect x="1260" y="13" width="145" height="32" rx="16" fill="#2a3a55"/><circle cx="1280" cy="29" r="10" fill="#9fb5dc"/><text x="1297" y="33" class="ui" fill="#eaf0fa" font-size="12">Researcher</text>
<text x="38" y="104" class="ui dark" font-size="27" font-weight="700">Image-to-LaTeX recognition</text>
<text x="38" y="132" class="ui muted" font-size="14">A human-in-the-loop OCR process: upload, recognize, preview, correct and explicitly insert.</text>
<rect x="38" y="165" width="640" height="590" rx="12" class="panel" filter="url(#shadow)"/><text x="58" y="196" class="ui dark" font-size="15" font-weight="700">Image input</text><text x="58" y="219" class="ui muted small">Upload a cropped equation, scan, screenshot or photograph</text><rect x="70" y="245" width="575" height="365" rx="10" fill="#f8fafd" stroke="#dfe6f0" stroke-dasharray="7 5"/><text x="355" y="300" text-anchor="middle" class="ui muted small">Illustrative uploaded formula image</text><text x="355" y="420" text-anchor="middle" class="ui dark" font-size="27">∫₀ᵀ e⁻ˣ² dx = √π / 2</text><text x="355" y="560" text-anchor="middle" class="ui muted small">Crop · rotate · adjust contrast</text><rect x="710" y="165" width="690" height="590" rx="12" class="panel" filter="url(#shadow)"/><text x="730" y="196" class="ui dark" font-size="15" font-weight="700">Recognition result</text><text x="730" y="219" class="ui muted small">Candidate LaTeX and preview; user approval required</text><rect x="740" y="245" width="630" height="130" rx="8" fill="#f7f9fc" stroke="#e2e8f0"/><text x="765" y="280" class="ui muted tiny">RECOGNIZED LATEX</text><text x="765" y="320" font-family="monospace" font-size="17" fill="#16845b">\int_0^T e^{-x^2}\,dx = \frac{\sqrt{\pi}}{2}</text><rect x="740" y="400" width="630" height="110" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="765" y="435" class="ui muted tiny">RENDERED PREVIEW</text><text x="1055" y="480" text-anchor="middle" class="ui dark" font-size="24">∫₀ᵀ e⁻ˣ² dx = √π / 2</text><rect x="740" y="545" width="145" height="38" rx="8" fill="#3268d8"/><text x="812" y="569" text-anchor="middle" class="ui" fill="#fff" font-size="12" font-weight="700">Insert equation</text><rect x="900" y="545" width="120" height="38" rx="8" fill="#edf1f7"/><text x="960" y="569" text-anchor="middle" class="ui dark small">Edit LaTeX</text><text x="740" y="620" class="ui muted small">No source changes occur until the user confirms insertion.</text>
</svg>