<text x="52" y="35" class="ui" fill="#fff" font-size="17" font-weight="700">ResearchForge</text>
<text x="225" y="35" class="ui" fill="#b8c5d9" font-size="12">LaTeX Research Workspace</text>
<rect x="1260" y="13" width="145" height="32" rx="16" fill="#2a3a55"/><circle cx="1280" cy="29" r="10" fill="#9fb5dc"/><text x="1297" y="33" class="ui" fill="#eaf0fa" font-size="12">Researcher</text>
<text x="38" y="104" class="ui dark" font-size="27" font-weight="700">Collaboration and review</text>
<text x="38" y="132" class="ui muted" font-size="14">Collaboration is a later tier, introduced only after persistence, revisions and authorization are robust.</text>
<rect x="38" y="165" width="900" height="590" rx="12" class="panel" filter="url(#shadow)"/><text x="58" y="196" class="ui dark" font-size="15" font-weight="700">Review and collaboration</text><text x="58" y="219" class="ui muted small">Comments and review threads attached to source ranges</text><circle cx="85" cy="243" r="19" fill="#dfe8fb"/><text x="85" y="249" text-anchor="middle" class="ui blue" font-size="12" font-weight="700">A</text><text x="120" y="240" class="ui dark small" font-weight="700">Author</text><text x="870" y="240" text-anchor="end" class="ui muted tiny">10:42</text><rect x="120" y="255" width="760" height="75" rx="8" fill="#f8fafd" stroke="#e7ecf3"/><text x="140" y="286" class="ui dark small">Could we explain the cross-dataset split more clearly?</text><circle cx="85" cy="373" r="19" fill="#dfe8fb"/><text x="85" y="379" text-anchor="middle" class="ui blue" font-size="12" font-weight="700">C</text><text x="120" y="370" class="ui dark small" font-weight="700">Co-author</text><text x="870" y="370" text-anchor="end" class="ui muted tiny">11:03</text><rect x="120" y="385" width="760" height="75" rx="8" fill="#f8fafd" stroke="#e7ecf3"/><text x="140" y="416" class="ui dark small">Added the dataset protocol and random-seed details.</text><circle cx="85" cy="503" r="19" fill="#dfe8fb"/><text x="85" y="509" text-anchor="middle" class="ui blue" font-size="12" font-weight="700">S</text><text x="120" y="500" class="ui dark small" font-weight="700">Supervisor</text><text x="870" y="500" text-anchor="end" class="ui muted tiny">11:21</text><rect x="120" y="515" width="760" height="75" rx="8" fill="#f8fafd" stroke="#e7ecf3"/><text x="140" y="546" class="ui dark small">Please check whether this paragraph duplicates Section 2.</text><rect x="970" y="165" width="430" height="590" rx="12" class="panel" filter="url(#shadow)"/><text x="990" y="196" class="ui dark" font-size="15" font-weight="700">Project access</text><text x="990" y="219" class="ui muted small">Example role model</text><rect x="995" y="235" width="380" height="64" rx="8" fill="#f8fafd" stroke="#e7ecf3"/><text x="1018" y="260" class="ui dark small" font-weight="700">Owner</text><text x="1018" y="280" class="ui muted tiny">Manage project and membership</text><rect x="995" y="323" width="380" height="64" rx="8" fill="#f8fafd" stroke="#e7ecf3"/><text x="1018" y="348" class="ui dark small" font-weight="700">Editor</text><text x="1018" y="368" class="ui muted tiny">Edit files and compile</text><rect x="995" y="411" width="380" height="64" rx="8" fill="#f8fafd" stroke="#e7ecf3"/><text x="1018" y="436" class="ui dark small" font-weight="700">Reviewer</text><text x="1018" y="456" class="ui muted tiny">Comment and suggest changes</text><rect x="995" y="499" width="380" height="64" rx="8" fill="#f8fafd" stroke="#e7ecf3"/><text x="1018" y="524" class="ui dark small" font-weight="700">Viewer</text><text x="1018" y="544" class="ui muted tiny">Read source and PDF</text>
</svg>