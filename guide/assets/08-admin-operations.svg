<text x="38" y="104" class="ui dark" font-size="27" font-weight="700">Administration and operations</text>
<text x="38" y="132" class="ui muted" font-size="14">Illustrative controls for queue health, worker status, resource quotas and compilation security.</text>
<rect x="38" y="165" width="1362" height="590" rx="12" class="panel" filter="url(#shadow)"/><text x="58" y="196" class="ui dark" font-size="15" font-weight="700">Worker operations</text><text x="58" y="219" class="ui muted small">Operational dashboard for administrators</text><rect x="65" y="240" width="300" height="120" rx="10" fill="#f8fafd" stroke="#e3e8f0"/><text x="85" y="275" class="ui muted small">Queue depth</text><text x="85" y="320" class="ui dark" font-size="28" font-weight="700">04</text><text x="85" y="342" class="ui muted tiny">Jobs waiting</text><rect x="395" y="240" width="300" height="120" rx="10" fill="#f8fafd" stroke="#e3e8f0"/><text x="415" y="275" class="ui muted small">Active builds</text><text x="415" y="320" class="ui dark" font-size="28" font-weight="700">02</text><text x="415" y="342" class="ui muted tiny">Running in isolated containers</text><rect x="725" y="240" width="300" height="120" rx="10" fill="#f8fafd" stroke="#e3e8f0"/><text x="745" y="275" class="ui muted small">Build success</text><text x="745" y="320" class="ui dark" font-size="28" font-weight="700">97.2%</text><text x="745" y="342" class="ui muted tiny">Rolling 7-day sample</text><rect x="1055" y="240" width="300" height="120" rx="10" fill="#f8fafd" stroke="#e3e8f0"/><text x="1075" y="275" class="ui muted small">Storage</text><text x="1075" y="320" class="ui dark" font-size="28" font-weight="700">38.4 GB</text><text x="1075" y="342" class="ui muted tiny">Artifacts and project files</text><rect x="65" y="395" width="820" height="290" rx="12" class="panel" filter="url(#shadow)"/><text x="85" y="426" class="ui dark" font-size="15" font-weight="700">Worker health</text><text x="85" y="449" class="ui muted small">Example operational status</text><text x="90" y="475" class="ui dark small" font-weight="600">Laravel queue workers</text><text x="470" y="475" class="ui green small">Healthy</text><text x="850" y="475" text-anchor="end" class="ui muted tiny">4 workers online</text><text x="90" y="523" class="ui dark small" font-weight="600">TeX Live research image</text><text x="470" y="523" class="ui green small">Healthy</text><text x="850" y="523" text-anchor="end" class="ui muted tiny">Pinned image digest verified</text><text x="90" y="571" class="ui dark small" font-weight="600">Conversion worker</text><text x="470" y="571" class="ui green small">Healthy</text><text x="850" y="571" text-anchor="end" class="ui muted tiny">2 workers online</text><text x="90" y="619" class="ui dark small" font-weight="600">OCR worker</text><text x="470" y="619" class="ui green small">Paused</text><text x="850" y="619" text-anchor="end" class="ui muted tiny">Not enabled in this deployment</text><rect x="920" y="395" width="435" height="290" rx="12" class="panel" filter="url(#shadow)"/><text x="940" y="426" class="ui dark" font-size="15" font-weight="700">Security controls</text><text x="940" y="449" class="ui muted small">Required operational safeguards</text><circle cx="950" cy="466" r="5" fill="#16845b"/><text x="968" y="470" class="ui dark tiny">Network disabled for compiler jobs</text><circle cx="950" cy="505" r="5" fill="#16845b"/><text x="968" y="509" class="ui dark tiny">Shell escape disabled by default</text><circle cx="950" cy="544" r="5" fill="#16845b"/><text x="968" y="548" class="ui dark tiny">CPU / memory / time quotas enforced</text><circle cx="950" cy="583" r="5" fill="#16845b"/><text x="968" y="587" class="ui dark tiny">No application secrets in worker containers</text><circle cx="950" cy="622" r="5" fill="#16845b"/><text x="968" y="626" class="ui dark tiny">Artifact access checked by project policy</text>
