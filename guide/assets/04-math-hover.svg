<text x="38" y="132" class="ui muted" font-size="14">A dedicated math service detects a complete formula range, parses it and displays a cached preview.</text>
<rect x="38" y="165" width="1362" height="620" rx="12" class="panel" filter="url(#shadow)"/><rect x="58" y="185" width="1322" height="580" fill="#fff"/><text x="88" y="225" class="ui muted small">main.tex · mathematical expression under pointer</text><text x="95" y="290" font-family="monospace" font-size="18" fill="#7655c9">\begin{equation}</text><text x="95" y="335" font-family="monospace" font-size="18" fill="#16845b">\mathcal{L}(\theta) = -\frac{1}{N}\sum_{i=1}^{N} y_i \log p_\theta(x_i)</text><rect x="90" y="350" width="850" height="4" fill="#f2b84b"/><text x="95" y="390" font-family="monospace" font-size="18" fill="#7655c9">\end{equation}</text><rect x="500" y="410" width="750" height="270" rx="12" fill="#fff" stroke="#9eb7e9" stroke-width="2" filter="url(#shadow)"/><text x="530" y="448" class="ui dark" font-size="14" font-weight="700">Formula preview</text><text x="1215" y="448" text-anchor="end" class="ui muted tiny">Math engine · cached result</text><text x="875" y="535" text-anchor="middle" class="ui dark" font-size="25">ℒ(θ) = − 1/N ∑ yᵢ log pθ(xᵢ)</text><text x="530" y="625" class="ui muted small">Preview is non-destructive. The source remains unchanged.</text><rect x="530" y="642" width="110" height="28" rx="7" fill="#edf2ff"/><text x="585" y="660" text-anchor="middle" class="ui blue small">Pin preview</text>
